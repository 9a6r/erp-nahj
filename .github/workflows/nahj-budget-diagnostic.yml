name: Nahj budget calendar diagnosis
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/diagnostics/budget_calendar.py'
      - '.github/workflows/nahj-budget-diagnostic.yml'
permissions:
  contents: read
concurrency:
  group: nahj-budget-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Run unchanged original cases and real budget boundaries across all twelve months
        env:
          NAHJ_TEST_SHARD: '1'
          NAHJ_TEST_PROFILE: payments
        run: |
          # Replace only the disposable harness entrypoint, never ERPNext code.
          cp .github/diagnostics/budget_calendar.py desktop/tests/modules/run_suite.py
          bash desktop/tests/modules/run-ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nahj-budget-calendar-diagnosis
          path: ${{ runner.temp }}/nahj-modules/results/
          include-hidden-files: true
          retention-days: 30
