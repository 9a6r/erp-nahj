name: Verify localized ERP and legacy recovery
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths: ['.github/workflows/nahj-localized-recovery.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: nahj-localized-recovery
  cancel-in-progress: false
jobs:
  erp:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: nahj-payments-candidate
          run-id: 43398733279
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/nahj-build
      - name: Test real ERP, Payments, backup, isolated recovery and reboot on Arch Zen
        env:
          NAHJ_FULL_STACK: '1'
        run: |
          cp "$RUNNER_TEMP/nahj-build/server_release.json" desktop/nahj_desktop/server_release.json
          bash desktop/tests/arch-vm.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nahj-candidate-erp
          path: ${{ runner.temp }}/nahj-arch/results/
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: nahj-payments-candidate
          run-id: 43398733279
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/nahj-build
      - name: Verify the retained previous release before independent migration
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from urllib.request import urlretrieve
          r=json.loads(Path('desktop/server-image/base-release-0.3.1.json').read_text())
          p=Path(os.environ['RUNNER_TEMP'])/'nahj-build'/r['archive']
          urlretrieve(r['url'],p)
          with p.open('rb') as f: assert hashlib.file_digest(f,'sha256').hexdigest()==r['sha256']
          assert p.stat().st_size==r['size']
          PY
      - name: Test independent legacy recovery, retained old site and Zen reboot
        env:
          NAHJ_FULL_STACK: '1'
          NAHJ_UPGRADE_VALIDATION: '1'
        run: |
          cp "$RUNNER_TEMP/nahj-build/server_release.json" desktop/nahj_desktop/server_release.json
          bash desktop/tests/arch-vm.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nahj-candidate-upgrade
          path: ${{ runner.temp }}/nahj-arch/results/
