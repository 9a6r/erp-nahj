name: Validate final localized desktop package
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths: ['.github/workflows/nahj-final-package.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: nahj-final-package-0.3.2
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: nahj-payments-candidate
          run-id: 43398733279
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/nahj-build
      - name: Verify the exact localized candidate and stage final package metadata
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'nahj-build'
          r=json.loads((root/'server_release.json').read_text())
          assert r['candidate_commit']=='71ac05a3cb0a84eaf43009a585303efbb3f45d10'
          assert r['sha256']=='36509722db27633ae1c65dc4d994e2ac68e0b3b6954adc81e7b5753c7c9f5105'
          assert r['version']=='0.3.2-rc1'
          p=root/r['archive']
          assert p.stat().st_size==r['size']
          with p.open('rb') as f: assert hashlib.file_digest(f,'sha256').hexdigest()==r['sha256']
          r['published']=True
          Path('desktop/nahj_desktop/server_release.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
          PYTHONPATH=desktop python -m nahj_desktop --version | grep -Fx 'Nahj Desktop 0.3.2-rc1'
      - name: Test the exact package with final user documentation on Arch Zen
        run: bash desktop/tests/arch-vm.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nahj-final-native
          path: |
            ${{ runner.temp }}/nahj-arch/results/
            ${{ runner.temp }}/nahj-arch/packages/
          if-no-files-found: error
          retention-days: 14
