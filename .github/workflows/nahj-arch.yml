name: Nahj native Arch and Linux Zen

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [develop]
    paths:
      - 'desktop/**'
      - '!desktop/**/*.md'
      - '!desktop/screenshots/**'
      - '.github/workflows/nahj-arch.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '!desktop/**/*.md'
      - '!desktop/screenshots/**'
      - '.github/workflows/nahj-arch.yml'

permissions:
  contents: read

concurrency:
  group: nahj-arch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Boot Arch, install Zen, and run native lifecycle tests
        run: bash desktop/tests/arch-vm.sh
      - name: Keep tested Arch package
        uses: actions/upload-artifact@v4
        with:
          name: nahj-arch-package
          path: ${{ runner.temp }}/nahj-arch/packages/*.pkg.tar.zst
          if-no-files-found: error
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nahj-arch-zen-evidence
          path: ${{ runner.temp }}/nahj-arch/results/
