name: Nahj on Arch derivatives with Linux Zen
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths: ['.github/workflows/nahj-derivatives.yml', 'desktop/tests/distros/**']
permissions:
  contents: read
concurrency:
  group: nahj-derivatives-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compatibility:
    name: ${{ matrix.distro }} / Zen / desktop and ERP
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        distro: [endeavouros, garuda]
    steps:
      - uses: actions/checkout@v6
      - name: Make room for the official ISO and disposable persistent VM disk
        run: |
          test "$GITHUB_ACTIONS" = true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h "$RUNNER_TEMP"
      - name: Obtain the exact published ERP server archive
        run: bash desktop/tests/build-ci-image.sh
      - name: Boot the actual distro filesystem, install Zen and test desktop and real ERP
        env:
          NAHJ_DISTRO: ${{ matrix.distro }}
          NAHJ_FULL_STACK: '1'
          NAHJ_NATIVE_AND_FULL: '1'
        run: bash desktop/tests/arch-vm.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nahj-${{ matrix.distro }}-zen
          path: ${{ runner.temp }}/nahj-arch/results/
          retention-days: 30
          if-no-files-found: error
