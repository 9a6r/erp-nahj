name: Nahj candidate timezone and legacy upgrade acceptance
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths: ['.github/workflows/nahj-candidate-followup.yml']
permissions:
  contents: read
  actions: read
jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          run-id: 43280223082
          github-token: ${{ github.token }}
          name: nahj-payments-candidate
          path: ${{ runner.temp }}/nahj-build
      - name: Repeat all 765 original tests in shard six with aligned database timezone
        env:
          NAHJ_TEST_PROFILE: payments
          NAHJ_TEST_SHARD: '6'
          NAHJ_SERVER_ARCHIVE: ${{ runner.temp }}/nahj-build/nahj-server-0.3.2-rc1-amd64.tar.gz
        run: |
          cp "$RUNNER_TEMP/nahj-build/server_release.json" desktop/nahj_desktop/server_release.json
          bash desktop/tests/modules/run-ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nahj-module-tests-6
          path: ${{ runner.temp }}/nahj-modules/results/
          include-hidden-files: true
  heatmap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          run-id: 43280223082
          github-token: ${{ github.token }}
          name: nahj-payments-candidate
          path: ${{ runner.temp }}/nahj-build
      - name: Reproduce the original test with real entries around the date boundary
        env:
          NAHJ_TEST_PROFILE: payments
          NAHJ_TEST_SHARD: '1'
          NAHJ_SERVER_ARCHIVE: ${{ runner.temp }}/nahj-build/nahj-server-0.3.2-rc1-amd64.tar.gz
        run: |
          cp "$RUNNER_TEMP/nahj-build/server_release.json" desktop/nahj_desktop/server_release.json
          cp .github/diagnostics/heatmap_timezone.py desktop/tests/modules/run_suite.py
          bash desktop/tests/modules/run-ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nahj-candidate-heatmap
          path: ${{ runner.temp }}/nahj-modules/results/
          include-hidden-files: true
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          run-id: 43280223082
          github-token: ${{ github.token }}
          name: nahj-payments-candidate
          path: ${{ runner.temp }}/nahj-build
      - name: Download and verify the exact previous release for migration
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from urllib.request import urlretrieve
          r=json.loads(Path('desktop/server-image/base-release-0.3.1.json').read_text())
          p=Path(os.environ['RUNNER_TEMP'])/'nahj-build'/r['archive']
          urlretrieve(r['url'],p)
          with p.open('rb') as f: assert hashlib.file_digest(f,'sha256').hexdigest()==r['sha256']
          assert p.stat().st_size==r['size']
          PY
      - name: Recover legacy data independently and verify both sites before and after reboot
        env:
          NAHJ_FULL_STACK: '1'
          NAHJ_UPGRADE_VALIDATION: '1'
        run: |
          cp "$RUNNER_TEMP/nahj-build/server_release.json" desktop/nahj_desktop/server_release.json
          bash desktop/tests/arch-vm.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nahj-candidate-upgrade
          path: ${{ runner.temp }}/nahj-arch/results/
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          run-id: 43280223082
          github-token: ${{ github.token }}
          name: nahj-payments-candidate
          path: ${{ runner.temp }}/nahj-build
      - name: Package and test the final desktop with its actual candidate version
        run: |
          cp "$RUNNER_TEMP/nahj-build/server_release.json" desktop/nahj_desktop/server_release.json
          PYTHONPATH=desktop python -m nahj_desktop --version | grep -Fx 'Nahj Desktop 0.3.2-rc1'
          bash desktop/tests/arch-vm.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nahj-candidate-native
          path: |
            ${{ runner.temp }}/nahj-arch/results/
            ${{ runner.temp }}/nahj-arch/packages/
